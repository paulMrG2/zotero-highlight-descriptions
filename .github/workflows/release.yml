name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - run: pnpm install

      - name: Sync version into manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '$VERSION';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - run: pnpm package

      - name: Generate SHA256 checksum
        run: sha256sum highlight-descriptions-$VERSION.xpi > highlight-descriptions-$VERSION.xpi.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: highlight-descriptions-${{ env.VERSION }}.xpi

      - name: Update update.json
        run: |
          node -e "
            const fs = require('fs');
            const u = JSON.parse(fs.readFileSync('update.json', 'utf8'));
            u.addons['highlightdescriptions@paulmrg2'].updates.unshift({
              version: '$VERSION',
              update_link: 'https://github.com/paulmrg2/zotero-highlight-descriptions/releases/download/$GITHUB_REF_NAME/highlight-descriptions-$VERSION.xpi'
            });
            fs.writeFileSync('update.json', JSON.stringify(u, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Release $GITHUB_REF_NAME"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            highlight-descriptions-$VERSION.xpi \
            highlight-descriptions-$VERSION.xpi.sha256
